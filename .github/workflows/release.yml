name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - v*

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@26
          cache: true
      - name: Prepare
        run: |
          VERSION=`node -e 'console.log(require("./package.json").version)'`
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "ASSETS_DIR=dist-assets" >> $GITHUB_ENV
          echo "ASSET_ZIP=request-x-v$VERSION.zip" >> $GITHUB_ENV
          pnpm i
      - name: Build
        run: |
          pnpm build
          mkdir -p $ASSETS_DIR
          cd dist && zip -r ../$ASSETS_DIR/$ASSET_ZIP . && cd ..
      - name: Publish to CWS
        run: |
          set -x
          npx chrome-webstore-upload-cli@4 --extension-id $EXTENSION_ID --source $ASSETS_DIR/$ASSET_ZIP
        env:
          EXTENSION_ID: cblonkdlnemhdeefhmaoiijjaedcphbf
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
